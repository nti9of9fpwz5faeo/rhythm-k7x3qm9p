<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07060d">
<title>Neon Blade</title>
<style>
  :root{--cyan:#50e6ff;--pink:#ed50aa;--gold:#ffc83c;--bg:#07060d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;color:#e8f6ff}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;background:url(img/bg.jpg) center/cover no-repeat}
  #hud{height:56px;display:flex;align-items:center;gap:6px;padding-top:env(safe-area-inset-top)}
  #hud img{width:34px;height:34px;transition:opacity .2s,transform .2s}
  #hud img.lost{opacity:.18;transform:scale(.8)}
  #fieldWrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
  canvas{display:block}
  #controls{height:170px;width:100%;max-width:520px;display:flex;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
  .btn{width:140px;height:140px;border:0;background:none;padding:0;touch-action:none}
  .btn img{width:100%;height:100%;pointer-events:none;transition:transform .06s}
  .btn.press img{transform:scale(.9)}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:18vh;background:center/cover no-repeat;z-index:10}
  .overlay.hide{display:none}
  #startOv{background-image:url(img/bg.jpg);justify-content:center;padding:0}
  #startOv h1{font-size:44px;margin:0 0 8px;color:#fff;text-shadow:0 0 12px var(--cyan),0 0 28px var(--cyan)}
  #startOv p{margin:6px 0;color:#bfe9f5}
  .ovBtn{margin-top:22px;font-size:22px;padding:14px 38px;border-radius:40px;border:2px solid var(--cyan);background:rgba(7,6,13,.7);color:#fff;box-shadow:0 0 16px rgba(80,230,255,.5)}
  #clearOv{background-image:url(img/clear.jpg)}
  #overOv{background-image:url(img/gameover.jpg)}
  #overOv .ovBtn{border-color:var(--pink);box-shadow:0 0 16px rgba(237,80,170,.5)}
  .result{font-size:18px;color:#fff;text-shadow:0 0 8px #000}
</style>
</head>
<body>
<div id="app">
  <div id="hud"></div>
  <div id="fieldWrap"><canvas id="cv"></canvas></div>
  <div id="controls">
    <button class="btn" id="bBreak" aria-label="ブレイク"><img src="img/btn_break.png" alt=""></button>
    <button class="btn" id="bMove" aria-label="進む"><img src="img/btn_move.png" alt=""></button>
  </div>
</div>

<div class="overlay" id="startOv">
  <h1>Neon Blade</h1>
  <p id="loadTxt">読み込み中…</p>
  <button class="ovBtn" id="startBtn" style="display:none">タップでスタート</button>
</div>
<div class="overlay hide" id="clearOv"><div class="result" id="clearTxt"></div><button class="ovBtn" data-retry>もう一回</button></div>
<div class="overlay hide" id="overOv"><div class="result" id="overTxt"></div><button class="ovBtn" data-retry>もう一回</button></div>

<script>
// ===== 設定 =====
const BPM = 129;          // 曲のテンポ
const OFFSET = 0.34;      // 曲の最初のドンまでの秒数
const WINDOW = 0.15;      // 押すタイミングの許容（前後の秒数）
const COLS = 8, ROWS = 7;
const MAX_HP = 5;
const GOAL_INDEX = 52;    // ここに着いたらクリア
const INTRO_BEATS = 16;   // 最初はブロックを出さない拍数
const SPB = 60 / BPM;

// ===== コース（ジグザグ） =====
const path = [];
for (let r = 0; r < ROWS; r++) {
  if (r % 2 === 0) for (let c = COLS - 1; c >= 0; c--) path.push({ c, r });
  else for (let c = 0; c < COLS; c++) path.push({ c, r });
}
const EXIT_INDEX = path.length - 1;

// ===== 画像 =====
const IMG = {};
const imgList = ['floor.jpg','wall.png','start.png','exit.png','block.png','block_broken.png',
  'char_idle.png','char_move.png','char_slash.png','char_damage.png','heart.png'];
function loadImg(n){return new Promise(res=>{const i=new Image();i.onload=()=>res();i.onerror=()=>res();i.src='img/'+n;IMG[n.split('.')[0]]=i;});}

// ===== 音 =====
let ctx, songBuf, breakBuf, songSrc = null;
async function loadAudio(url){const r=await fetch(url);return await r.arrayBuffer();}

// ===== 画面 =====
const cv = document.getElementById('cv'), g = cv.getContext('2d');
let cell = 40, dpr = 1;
function layout(){
  const wrap = document.getElementById('fieldWrap').getBoundingClientRect();
  cell = Math.floor(Math.min((wrap.width - 16) / COLS, (wrap.height - 8) / ROWS));
  dpr = window.devicePixelRatio || 1;
  cv.style.width = cell * COLS + 'px'; cv.style.height = cell * ROWS + 'px';
  cv.width = cell * COLS * dpr; cv.height = cell * ROWS * dpr;
}
window.addEventListener('resize', layout);

const hud = document.getElementById('hud');
function drawHud(){
  hud.innerHTML='';
  for(let i=0;i<MAX_HP;i++){const im=document.createElement('img');im.src='img/heart.png';if(i>=hp)im.className='lost';hud.appendChild(im);}
}

// ===== ゲーム状態 =====
let state = 'loading';
let songStart = 0, hp, player, notes, effects, texts, nextBeat, acted, pendingCheck, charState, charUntil, shakeUntil, lastMoveAt, spawnSeed;
let noteId = 0;

function reset(){
  hp = MAX_HP; player = { idx: 0, from: 0, at: 0 };
  notes = []; effects = []; texts = [];
  nextBeat = 0; acted = -1; pendingCheck = [];
  charState = 'idle'; charUntil = 0; shakeUntil = 0; spawnSeed = 12345; earlyInput = null;
  drawHud();
}
function rand(){ spawnSeed = (spawnSeed * 16807) % 2147483647; return spawnSeed / 2147483647; }

function songTime(){ return ctx.currentTime - songStart - (ctx.outputLatency || 0); }
function beatTime(n){ return OFFSET + n * SPB; }

// 4拍ごとのブロックの出し方
const PATTERNS = [[1,0,1,0],[1,0,0,0],[1,0,1,0],[0,0,1,0],[1,0,0,1]];
let curPattern = PATTERNS[0];

function onBeat(n, t){
  // ブロックが1マス迫る
  for (const nt of notes){ nt.from = nt.idx; nt.idx -= 1; nt.at = t; }
  // ブロックを出す
  if (n >= INTRO_BEATS){
    if (n % 4 === 0) curPattern = PATTERNS[Math.floor(rand() * PATTERNS.length)];
    if (curPattern[n % 4] && !notes.some(x => x.idx >= EXIT_INDEX - 1)){
      notes.push({ id: noteId++, idx: EXIT_INDEX, from: EXIT_INDEX + 0.6, at: t });
    }
  }
  shakeUntil = t + 0.08;
  // 拍の直前に押されていたら今実行
  if (earlyInput && t - earlyInput.time <= WINDOW){ doAction(earlyInput.type, n, t); }
  earlyInput = null;
  pendingCheck.push({ n, checkAt: beatTime(n) + WINDOW });
}

function checkHit(t){
  for (const nt of [...notes]){
    if (nt.idx <= player.idx){
      notes.splice(notes.indexOf(nt), 1);
      damage(t);
    }
  }
}

function damage(t){
  hp--; drawHud();
  charState = 'damage'; charUntil = t + 0.4;
  texts.push({ s: 'ダメージ', idx: player.idx, t, col: '#ed50aa' });
  if (navigator.vibrate) navigator.vibrate(60);
  if (hp <= 0) end(false);
}

function doAction(type, n, t){
  acted = n;
  if (type === 'move'){
    if (player.idx < GOAL_INDEX){
      player.from = player.idx; player.idx += 1; player.at = t;
      charState = 'move'; charUntil = t + 0.18;
    }
  } else {
    charState = 'slash'; charUntil = t + 0.22;
    // 1タップで壊せるのは一番近い1個だけ
    const target = notes.filter(x => x.idx <= player.idx).sort((a,b)=>a.idx-b.idx)[0];
    if (target){
      notes.splice(notes.indexOf(target), 1);
      effects.push({ idx: target.idx, t });
      playSE();
    }
  }
}

let earlyInput = null;
function input(type){
  if (state !== 'play') return;
  const t = songTime();
  const n = Math.round((t - OFFSET) / SPB);
  const diff = t - beatTime(n);
  if (Math.abs(diff) > WINDOW || n < 0){
    texts.push({ s: 'ズレ', idx: player.idx, t, col: '#9aa' });
    return;
  }
  if (acted === n) return; // 1拍に1回だけ
  if (diff < 0){ earlyInput = { type, time: t }; acted = n; }   // 拍の少し前 → 拍で実行
  else if (n < nextBeat){ doAction(type, n, t); }               // 拍の少し後 → すぐ実行
  else { earlyInput = { type, time: t }; acted = n; }
}

function playSE(){
  if (!breakBuf) return;
  const s = ctx.createBufferSource(); s.buffer = breakBuf; s.connect(ctx.destination); s.start();
}

function end(clear){
  if (state !== 'play') return;
  state = clear ? 'clear' : 'over';
  setTimeout(() => {
    if (songSrc){ try{ songSrc.stop(); }catch(e){} }
    const beats = Math.max(0, nextBeat);
    if (clear){ document.getElementById('clearTxt').textContent = `残りHP ${hp} ／ ${beats}拍でゴール`; document.getElementById('clearOv').classList.remove('hide'); }
    else { document.getElementById('overTxt').textContent = `ゴールまであと ${GOAL_INDEX - player.idx} マス`; document.getElementById('overOv').classList.remove('hide'); }
  }, clear ? 600 : 500);
}

// ===== 描画 =====
function cellXY(idx){
  const i = Math.max(0, Math.min(path.length - 1, idx));
  const a = path[Math.floor(i)], b = path[Math.ceil(i)], f = i - Math.floor(i);
  return { x: (a.c + (b.c - a.c) * f + 0.5) * cell, y: (a.r + (b.r - a.r) * f + 0.5) * cell };
}
function tween(from, to, at, t){
  const k = Math.min(1, Math.max(0, (t - at) / 0.09)); // 0.09秒でサッと動いて止まる
  const e = 1 - Math.pow(1 - k, 3);
  return from + (to - from) * e;
}

function draw(t){
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  let sx = 0, sy = 0;
  if (t < shakeUntil){ sx = (Math.random() - .5) * 5; sy = (Math.random() - .5) * 5; }
  g.clearRect(0, 0, cell * COLS, cell * ROWS);
  g.save(); g.translate(sx, sy);

  // 床
  g.fillStyle = 'rgba(5,5,12,.55)'; g.fillRect(0, 0, cell * COLS, cell * ROWS);
  for (const p of path){ g.globalAlpha = .9; g.drawImage(IMG.floor, p.c * cell, p.r * cell, cell, cell); }
  g.globalAlpha = 1;
  // 方眼
  g.strokeStyle = 'rgba(80,230,255,.14)'; g.lineWidth = 1;
  for (let c = 1; c < COLS; c++){ g.beginPath(); g.moveTo(c * cell, 0); g.lineTo(c * cell, ROWS * cell); g.stroke(); }
  for (let r = 1; r < ROWS; r++){ g.beginPath(); g.moveTo(0, r * cell); g.lineTo(COLS * cell, r * cell); g.stroke(); }

  // スタートと出口
  const s0 = cellXY(0), e0 = cellXY(EXIT_INDEX);
  g.drawImage(IMG.start, s0.x - cell * .46, s0.y - cell * .46, cell * .92, cell * .92);
  g.drawImage(IMG.exit, e0.x - cell * .48, e0.y - cell * .48, cell * .96, cell * .96);

  // ゴールの破線
  const gp = path[GOAL_INDEX], gx = gp.c * cell; // 出口側のふち
  g.save(); g.strokeStyle = '#ffc83c'; g.lineWidth = 3; g.setLineDash([6, 5]);
  g.shadowColor = '#ffc83c'; g.shadowBlur = 8;
  g.beginPath(); g.moveTo(gx, gp.r * cell + 3); g.lineTo(gx, (gp.r + 1) * cell - 3); g.stroke(); g.restore();

  // 壁
  const wh = Math.max(6, cell * .16);
  for (let r = 0; r < ROWS - 1; r++){
    const y = (r + 1) * cell - wh / 2;
    const x0 = r % 2 === 0 ? cell : 0, x1 = r % 2 === 0 ? COLS * cell : (COLS - 1) * cell;
    g.drawImage(IMG.wall, x0, y, x1 - x0, wh);
  }
  g.strokeStyle = '#1d2230'; g.lineWidth = 3; g.strokeRect(1.5, 1.5, COLS * cell - 3, ROWS * cell - 3);

  // ブロック
  for (const nt of notes){
    const p = cellXY(tween(nt.from, nt.idx, nt.at, t));
    const sz = cell * .94;
    g.drawImage(IMG.block, p.x - sz / 2, p.y - sz / 2, sz, sz);
  }
  // 壊れたブロック
  effects = effects.filter(e => t - e.t < 0.3);
  for (const e of effects){
    const k = (t - e.t) / 0.3, p = cellXY(e.idx), sz = cell * (1.1 + k * .3);
    g.globalAlpha = 1 - k; g.drawImage(IMG.block_broken, p.x - sz / 2, p.y - sz / 2, sz, sz); g.globalAlpha = 1;
  }

  // キャラ
  drawChar(t);

  // 文字
  texts = texts.filter(x => t - x.t < 0.5);
  g.textAlign = 'center'; g.font = `bold ${Math.round(cell * .32)}px sans-serif`;
  for (const x of texts){
    const p = cellXY(x.idx), k = (t - x.t) / 0.5;
    g.globalAlpha = 1 - k; g.fillStyle = x.col; g.fillText(x.s, p.x, p.y - cell * .55 - k * cell * .3); g.globalAlpha = 1;
  }
  g.restore();
}

function drawChar(t){
  if (t > charUntil) charState = 'idle';
  const im = IMG['char_' + charState];
  const p = cellXY(tween(player.from, player.idx, player.at, t));
  // 向き：次のマスの方向
  const a = path[player.idx], b = path[Math.min(player.idx + 1, path.length - 1)];
  const dx = b.c - a.c, dy = b.r - a.r;
  const w = cell * 2.3, h = w * im.height / im.width;
  const ax = 0.66, ay = 0.52; // 画像の中で体の中心がある場所
  g.save(); g.translate(p.x, p.y);
  if (dx > 0) g.scale(-1, 1);
  else if (dy > 0) g.rotate(-Math.PI / 2);
  if (charState === 'damage' && Math.floor(t * 20) % 2) g.globalAlpha = .45;
  g.shadowColor = 'rgba(80,230,255,.9)'; g.shadowBlur = cell * .25;
  g.drawImage(im, -w * ax, -h * ay, w, h);
  g.restore();
}

// ===== ループ =====
function loop(){
  requestAnimationFrame(loop);
  if (state === 'loading') return;
  const t = state === 'play' || state === 'clear' || state === 'over' ? songTime() : 0;
  if (state === 'play'){
    while (t >= beatTime(nextBeat)){ onBeat(nextBeat, beatTime(nextBeat)); nextBeat++; }
    while (pendingCheck.length && t >= pendingCheck[0].checkAt){ pendingCheck.shift(); checkHit(t); }
    if (player.idx >= GOAL_INDEX && hp > 0) end(true);
    if (t > songBuf.duration) end(false);
  }
  draw(t);
}

// ===== 操作 =====
function bindBtn(id, type){
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('press'); input(type); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => el.addEventListener(ev, () => el.classList.remove('press')));
}
bindBtn('bBreak', 'break'); bindBtn('bMove', 'move');
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key === 'ArrowLeft' || e.key === 'j') input('break');
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'k') input('move');
});

function startGame(){
  document.querySelectorAll('.overlay').forEach(o => o.classList.add('hide'));
  reset();
  if (songSrc){ try{ songSrc.stop(); }catch(e){} }
  songSrc = ctx.createBufferSource(); songSrc.buffer = songBuf; songSrc.connect(ctx.destination);
  songStart = ctx.currentTime + 0.25;
  songSrc.start(songStart);
  state = 'play';
}
document.getElementById('startBtn').addEventListener('click', async () => {
  if (ctx.state === 'suspended') await ctx.resume();
  startGame();
});
document.querySelectorAll('[data-retry]').forEach(b => b.addEventListener('click', startGame));

// ===== 起動 =====
(async () => {
  layout();
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const [songAB, seAB] = await Promise.all([loadAudio('audio/song.mp3'), loadAudio('audio/break.mp3'), ...imgList.map(loadImg)]);
  songBuf = await ctx.decodeAudioData(songAB);
  breakBuf = await ctx.decodeAudioData(seAB);
  reset(); layout();
  state = 'ready';
  document.getElementById('loadTxt').textContent = '拍に合わせて「ブレイク」と「進む」';
  document.getElementById('startBtn').style.display = '';
  loop();
})();
</script>
</body>
</html>
