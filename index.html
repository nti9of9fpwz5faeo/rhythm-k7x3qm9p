<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#065bfa">
<title>Neon Blade</title>
<style>
  :root{--cyan:#8af3fa;--pink:#ff3550;--gold:#ffe3a2;--bg:#0b1115;--navy:#17232a;--beat:0}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;color:#edf5f5}
  button{font:inherit;cursor:pointer}
  button:focus-visible{outline:2px solid #fff;outline-offset:5px}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 12px calc(env(safe-area-inset-bottom) + 18px);isolation:isolate;background:radial-gradient(ellipse at 50% 46%,#15202688,transparent 65%),#0b1115}
  #app:before,.overlay:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(circle at -10% 0%,transparent 0 138px,#536e7922 139px 140px,transparent 141px 165px,#536e7914 166px 168px,transparent 169px),radial-gradient(circle at 112% 73%,transparent 0 125px,#536e791c 126px 127px,transparent 128px 152px,#536e7912 153px 154px,transparent 155px)}
  #app:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;opacity:.32;background-image:radial-gradient(circle,#79929c 1px,transparent 1.5px);background-size:83px 119px;background-position:23px 41px}
  #top{flex:none;width:min(100%,460px);display:flex;flex-direction:column;align-items:center}
  #hud{height:35px;display:flex;align-items:center;gap:10px}
  #hud svg{width:29px;height:29px;overflow:visible;filter:drop-shadow(0 0 5px #5ddfeb44);transition:opacity .2s,transform .2s}
  #hud svg.lost{opacity:.22;transform:scale(.88);filter:grayscale(1)}
  #judge{height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  #jWord{font-size:23px;font-weight:700;letter-spacing:.16em;min-height:23px}
  #jSub{font-size:10px;margin-top:5px;color:#a7bec5;letter-spacing:.12em;min-height:10px}
  #judge.pop #jWord{animation:jpop .28s ease-out}
  @keyframes jpop{0%{transform:scale(1.18);opacity:.4}45%{transform:scale(.98);opacity:1}100%{transform:scale(1)}}
  #progress{width:100%;height:4px;border:1px solid #63727c88;border-radius:4px;background:#121b22;margin:9px 0 0;overflow:hidden}
  #progress i{display:block;height:100%;width:0;background:#8af3fa;box-shadow:0 0 8px #7ff7ff;border-radius:4px}
  #fieldWrap{display:flex;align-items:center;justify-content:center;width:100%;flex:1;min-height:0;padding:12px 0;position:relative}
  canvas{display:block;will-change:transform}
  #controls{flex:none;width:min(100%,460px);display:flex;gap:18px;height:96px;margin-top:8px}
  .btn{position:relative;overflow:hidden;display:flex;justify-content:center;align-items:center;gap:6px;flex:1;min-width:0;height:100%;border:1.5px solid var(--accent);border-radius:19px;color:#f1fbfc;background:linear-gradient(155deg,#183d4499,#0d181dcc 65%,#18505b66);padding:8px;touch-action:none;box-shadow:0 0 15px #4be3ef12,inset 0 0 22px #77eefa09;transition:opacity .2s,transform .06s,filter .12s;--accent:#8af3fa}
  #bBreak{--accent:#ff3550;background:linear-gradient(155deg,#4a0e1b99,#220b12cc 65%,#64132066);box-shadow:0 0 15px #ff163a15,inset 0 0 22px #ff355009}
  .btn:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#ffffff03 3px 4px)}
  .btn .icon{width:51px;height:51px;flex:none;overflow:visible;position:relative}
  .btn span{font-size:clamp(16px,4.6vw,22px);font-weight:800;position:relative;white-space:nowrap}
  .btn .bubbles{position:absolute;right:5px;bottom:4px;width:43px;height:42px;opacity:.55;color:var(--accent)}
  .btn.locked{opacity:.38}
  .btn.flash{animation:buttonFlash .16s ease-out}
  @keyframes buttonFlash{from{filter:brightness(1.8);box-shadow:0 0 24px var(--accent)}to{filter:brightness(1)}}
  .btn.press{transform:scale(.97)}
  #impactVeil{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;box-shadow:inset 0 0 75px #ff173e99}
  #impactVeil.hit{animation:damageFlash .32s ease-out}
  @keyframes damageFlash{0%{opacity:.9}100%{opacity:0}}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);background:radial-gradient(ellipse at 50% 34%,#19292de6,transparent 68%),#0b1115;isolation:isolate;z-index:10}
  .overlay.hide{display:none}
  .eyebrow{font-size:10px;letter-spacing:.28em;color:#8ca4ac;margin-bottom:12px}
  #startOv h1{font-size:clamp(32px,9vw,46px);font-weight:700;letter-spacing:.04em;margin:0;color:#f1fbfc}
  #startOv h1 b{color:#91f5fa;font-weight:700}
  #startOv p{font-size:12px;margin:10px 0;color:#99aeb6;text-align:center;line-height:1.8}
  .titleArt{width:175px;height:130px;position:relative;display:grid;place-items:center;margin:10px 0}
  .titleArt:before{content:"";position:absolute;width:95px;height:95px;border-radius:50%;border:1px solid #64dfe744;box-shadow:0 0 40px #51dce911}
  .titleArt img{width:115px;height:112px;object-fit:contain;position:relative;filter:drop-shadow(0 0 13px #5be6fa33)}
  #songList{display:flex;flex-direction:column;gap:11px;margin-top:12px;width:min(360px,100%)}
  .songBtn{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:17px 18px;border-radius:12px;border:1px solid #8af3fa55;background:linear-gradient(120deg,#14303899,#0d171b);color:#f1fbfc;font-size:15px;text-align:left;min-height:58px}
  .songBtn small{color:#9edce2;font-size:11px;white-space:nowrap}
  .songBtn.hard{border-color:#ff355055;background:linear-gradient(120deg,#2c141ccc,#131619)}
  .songBtn.hard small{color:#ff8b9a}
  .songBtn:disabled{opacity:.5}
  .ovBtn{margin-top:22px;font-size:17px;padding:14px 35px;border-radius:12px;border:1px solid var(--cyan);background:#17303977;color:#effbfc;min-width:190px}
  .ovBtn.sub{font-size:14px;padding:11px 26px;margin-top:12px;border-color:#52646c;background:transparent;color:#b6c7cc}
  #overOv .ovBtn:not(.sub){border-color:var(--pink);background:#36101b88}
  .resultTitle{font-size:34px;letter-spacing:.12em;margin:20px 0;color:var(--cyan)}
  #overOv .resultTitle{color:#ff6178}
  .resultMark{font-size:54px;color:var(--gold);filter:drop-shadow(0 0 14px #f9cc6e55)}
  #overOv .resultMark{color:#ff3550}
  .result{font-size:12px;line-height:2;text-align:center;color:#b6c8d0;max-width:100%}
  @media(max-height:680px){#app{padding-top:calc(env(safe-area-inset-top) + 8px);padding-bottom:calc(env(safe-area-inset-bottom) + 10px)}#controls{height:78px;margin-top:3px}#hud{height:29px}#hud svg{width:25px;height:25px}#judge{height:38px}#fieldWrap{padding:8px 0}.titleArt{height:85px}.titleArt img{height:80px}.songBtn{padding:12px 16px;min-height:49px}#startOv p{margin:6px 0}}
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  /* 承認された、鮮やかな色と太い黒ふちのデザイン */
  :root{--cyan:#36e8ff;--pink:#ff16ba;--gold:#ffe735;--bg:#075ffa;--navy:#091329}
  html,body{font-family:"Arial Rounded MT Bold","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif}
  #app{--sky1:#034afb;--sky2:#00bff2;background:linear-gradient(155deg,var(--sky1),var(--sky2));transition:background .3s}
  #app:before,.overlay:before{background:radial-gradient(circle at 0% 19%,transparent 0 72px,#35eaff88 73px 85px,transparent 86px),radial-gradient(circle at 105% 68%,transparent 0 88px,#27f0fd66 89px 100px,transparent 101px);opacity:.8}
  #app:after{opacity:.35;background:linear-gradient(135deg,transparent 30%,#31e9ff66 30% 36%,transparent 36% 80%,#73edff66 80% 88%,transparent 88%);background-size:360px 430px}
  #app[data-zone="1"]:after{background:repeating-linear-gradient(135deg,transparent 0 90px,#ff69f44d 90px 124px,transparent 124px 185px)}
  #top{width:min(100%,500px)}
  #hud{height:42px;gap:7px}#hud svg{width:33px;height:33px;filter:none}#hud svg.lost{opacity:.8;filter:none}
  #judge{height:54px}#jWord{font-size:27px;font-weight:1000;letter-spacing:.015em;-webkit-text-stroke:4px #09121e;paint-order:stroke fill;color:#fff!important}
  #jSub{font-size:12px;font-weight:900;color:#fff;letter-spacing:.02em;-webkit-text-stroke:3px #09121e;paint-order:stroke fill}
  #progress{height:10px;border:3px solid #081221;border-radius:10px;background:#173279;overflow:hidden;margin-top:7px}#progress i{background:#34e7ff;box-shadow:none}
  #fieldWrap{overflow:hidden;padding:14px 0;align-items:center}
  #cv{-webkit-mask-image:linear-gradient(transparent,#000 10px,#000 calc(100% - 10px),transparent);mask-image:linear-gradient(transparent,#000 10px,#000 calc(100% - 10px),transparent)}
  #controls{width:min(100%,500px);height:98px;gap:14px}
  .btn,#bBreak{border:4px solid #081221;border-radius:23px;box-shadow:inset 0 0 0 2px #b8ffff;background:linear-gradient(120deg,#76ff4d,#05e8ed);--accent:#3effdb}
  #bBreak{background:linear-gradient(120deg,#ff38bf,#ff05a0);box-shadow:inset 0 0 0 2px #ff9ae9;--accent:#ff22b4}
  .btn .bubbles,.btn:before{display:none}.btn .icon{width:46px;height:46px;filter:drop-shadow(1px 1px 0 #06101b) drop-shadow(-1px -1px 0 #06101b)}
  .btn span{font-size:clamp(16px,4.5vw,23px);font-weight:1000;-webkit-text-stroke:3.5px #081221;paint-order:stroke fill}
  .btn.locked{opacity:.65;filter:saturate(.5)}
  #beatWash{position:absolute;inset:0;background:#b7ffff;opacity:0;pointer-events:none;z-index:2}
  .overlay{background:linear-gradient(150deg,#0842ed,#04bee9);color:#fff}
  #startOv h1{font-weight:1000;-webkit-text-stroke:5px #071323;paint-order:stroke fill}#startOv h1 b{color:#bdff32;font-weight:1000}
  .eyebrow,#startOv p{color:#fff;text-shadow:0 2px 1px #124aac}
  .titleArt:before{border:4px solid #0b1530;background:#22defbaa;box-shadow:0 0 0 3px #b8fbff}
  .songBtn,.songBtn.hard{border:3px solid #071423;background:#153fbed9;box-shadow:inset 0 0 0 1px #a2dfff;color:#fff;font-weight:800}
  .songBtn.hard{background:#6716b5d9}.songBtn small,.songBtn.hard small{color:#c7ff56}
  .ovBtn,#overOv .ovBtn:not(.sub){border:3px solid #091221;background:#14e2c8;color:#fff;font-weight:900;-webkit-text-stroke:2px #091221;paint-order:stroke fill;box-shadow:inset 0 0 0 2px #afffe7}
  .ovBtn.sub{color:#fff;background:#1348b9;border-color:#091221}
  .resultTitle,.resultMark{font-weight:1000;color:#c7ff44;-webkit-text-stroke:4px #091221;paint-order:stroke fill;filter:none}
  .result{color:#fff;font-weight:700;text-shadow:0 1px 2px #16367e}
  @media(max-height:680px){#hud{height:31px}#hud svg{width:27px;height:27px}#judge{height:43px}#jWord{font-size:24px}#controls{height:78px}.songBtn{min-height:44px;padding:10px 13px}#songList{gap:8px}.titleArt{height:70px}.titleArt img{height:70px}}

</style>
</head>
<body>
<div id="app">
  <div id="top">
  <div id="hud" aria-label="体力5"></div>
  <div id="judge"><span id="jWord"></span><small id="jSub"></small></div>
  <div id="progress"><i id="progFill"></i></div>
  </div>
  <div id="fieldWrap"><canvas id="cv"></canvas></div>
  <div id="controls">
    <button class="btn" id="bMove" aria-label="進む"><svg class="icon" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8 9 31q-2 3 2 3h11v21h20V34h11q4 0 2-3Z" fill="#66dfe21a" stroke="#b6fbff" stroke-width="2.5" stroke-linejoin="round"/></svg><span>進む</span><svg class="bubbles" viewBox="0 0 50 50" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width=".8"><circle cx="36" cy="31" r="7"/><circle cx="23" cy="41" r="3.5"/><circle cx="42" cy="44" r="2"/><circle cx="32" cy="17" r="2.4"/><circle cx="16" cy="33" r="1.4"/><circle cx="42" cy="9" r="1"/></g></svg></button>
    <button class="btn" id="bBreak" aria-label="ブレイク"><svg class="icon" viewBox="0 0 64 64" aria-hidden="true"><rect x="16" y="17" width="35" height="35" rx="3" fill="#920d2588" stroke="#ff3550" stroke-width="2"/><path d="M33 20v29M19 34h29" stroke="#c01c93" stroke-width="1"/><path d="m6 57 13-22L59 6 47 29Z" fill="#b5fbff" stroke="#62eafa" stroke-width="1.5"/><path d="m9 54 43-34" stroke="#fff" stroke-width="1.5"/></svg><span>ブレイク</span><svg class="bubbles" viewBox="0 0 50 50" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width=".8"><circle cx="36" cy="31" r="7"/><circle cx="23" cy="41" r="3.5"/><circle cx="42" cy="44" r="2"/><circle cx="32" cy="17" r="2.4"/><circle cx="16" cy="33" r="1.4"/><circle cx="42" cy="9" r="1"/></g></svg></button>
  </div>
  <div id="beatWash"></div>
  <div id="impactVeil"></div>
</div>

<div class="overlay" id="startOv">
  <span class="eyebrow">MOVE WITH THE BEAT</span>
  <h1>NEON <b>BLADE</b></h1>
  <div class="titleArt"><img src="img/char_idle.png" alt="シアンの剣を持った主人公"></div>
  <p id="loadTxt">読み込み中…</p>
  <div id="songList"></div>
  <p>まずは迫るノーツをブレイク。<br>すき間を見つけて、進もう。</p>
</div>
<div class="overlay hide" id="clearOv"><div class="resultMark">◇</div><h2 class="resultTitle">CLEAR</h2><div class="result" id="clearTxt"></div><button class="ovBtn" data-retry>もう一回</button><button class="ovBtn sub" data-select>曲えらび</button></div>
<div class="overlay hide" id="overOv"><div class="resultMark">⌁</div><h2 class="resultTitle">GAME OVER</h2><div class="result" id="overTxt"></div><button class="ovBtn" data-retry>もう一回</button><button class="ovBtn sub" data-select>曲えらび</button></div>

<script>
// ===== 設定 =====
// 曲リスト（bpm＝テンポ、offset＝最初のドンまでの秒数）
const SONGS = [
  { name: 'Zombie Protocol',     file: 'audio/song.mp3',    bpm: 129,   offset: 0.34, level: 'ふつう' },
  { name: 'Stutter Bass Groove', file: 'audio/stutter.mp3', bpm: 150.1, offset: 0.0,  level: 'はやい', hard: true },
  { name: 'Bass Arcade',         file: 'audio/bass_arcade.mp3', bpm: 134.4, offset: 0.085, level: 'むずかしい', hard: true, dense: true },
  { name: 'Frostbite Breakbeat', file: 'audio/frostbite.mp3', bpm: 129.9, offset: 0.21, level: 'クール', hard: true },
];
let song = SONGS[0], BPM, OFFSET, SPB, WINDOW;
function setSong(sg){ song = sg; GAPS = sg.dense ? GAPS_DENSE : GAPS_NORMAL; BPM = sg.bpm; OFFSET = sg.offset; SPB = 60 / BPM; WINDOW = Math.min(0.17, SPB * 0.36); }
const COLS = 8, ROWS = 11;
const MAX_HP = 5;
// チェックポイント（破線）。着いたら解除されて、Gが次の場所へ移動
const LINES = [4, 10, 16, 22, 28, 35];
const REVEAL_ENDS = [19, 26, 32, 35, 39, 39]; // 開始時は手前の横道3本まで
const G_AHEAD = 4;        // Gはラインの何マス先に置くか
const GOAL_INDEX = LINES[LINES.length - 1]; // 最後のラインでクリア
const INTRO_BEATS = 4;    // 最初の数拍はブロックが止まってる（準備時間）
const FIRST_GAP = 3;      // スタートから一番近いブロックまでのマス数

// ===== コース（ジグザグ） =====
// 長い直線 → 中くらい → 短い折り返し → 長い直線。最後の4マスは出現口用。
const path = [];
const WAYPOINTS = [[7,0],[0,0],[0,2],[5,2],[5,4],[2,4],[2,6],[7,6],[7,8],[0,8],[0,10],[2,10]];
for(let k=0;k<WAYPOINTS.length;k++){
  const [c,r]=WAYPOINTS[k];
  if(!k){path.push({c,r});continue;}
  const last=path[path.length-1],dc=Math.sign(c-last.c),dr=Math.sign(r-last.r);
  for(let x=last.c+dc,y=last.r+dr;;x+=dc,y+=dr){path.push({c:x,r:y});if(x===c&&y===r)break;}
}
// 縦の区間では直前の左右向きを維持する。
function facesRight(idx){
  for(let i=Math.min(idx,path.length-2);i>=0;i--){
    const dx=path[i+1].c-path[i].c;if(dx)return dx>0;
  }
  return false;
}
const EXIT_INDEX = path.length - 1;

// ===== 画像 =====
const IMG = {};
const imgList = ['char_idle.png','char_move.png','char_slash.png','char_damage.png'];
function loadImg(n){return new Promise(res=>{const i=new Image();i.onload=()=>res();i.onerror=()=>res();i.src='img/'+n;IMG[n.split('.')[0]]=i;});}

// ===== 音 =====
let ctx, songBuf, breakBuf, moveBuf, songSrc = null;
const bufCache = {};
async function loadAudio(url){const r=await fetch(url);if(!r.ok)throw new Error(`Audio ${r.status}`);return await r.arrayBuffer();}

// ===== 画面 =====
const cv = document.getElementById('cv'); let g = cv.getContext('2d');
// カメラには約3本の横道（5行分）を表示。コースの論理座標とは独立。
const PAD=14, VIEW_ROWS=5;
let cameraRow=0,cameraFrom=0,cameraTarget=0,cameraAt=-9;
let revealEnd=REVEAL_ENDS[0],revealFrom=REVEAL_ENDS[0];
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
let cell=40,dpr=1,boardW=320,boardH=280;
function layout(){
  const wrap=document.getElementById('fieldWrap'),box=wrap.getBoundingClientRect(),style=getComputedStyle(wrap);
  const h=box.height-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);
  cell=Math.max(8,Math.min((Math.min(box.width,520)-PAD*2)/COLS,(h-PAD*2)/VIEW_ROWS));
  boardW=COLS*cell+PAD*2;boardH=VIEW_ROWS*cell+PAD*2;
  dpr=Math.min(window.devicePixelRatio||1,3);
  cv.style.width=boardW+'px';cv.style.height=boardH+'px';
  cv.width=Math.round(boardW*dpr);cv.height=Math.round(boardH*dpr);
  buildNoteSprite();
}
function cameraAtTime(t){
  const k=reduceMotion.matches?1:Math.max(0,Math.min(1,(t-cameraAt)/.35));
  return cameraFrom+(cameraTarget-cameraFrom)*(1-Math.pow(1-k,3));
}
function advanceView(t){
  cameraFrom=cameraAtTime(t);cameraAt=t;
  revealFrom=revealEnd;revealEnd=REVEAL_ENDS[lineK];
  // 出現口と主人公を両方画面内に保つ。
  cameraTarget=Math.max(0,Math.min(ROWS-VIEW_ROWS,path[player.idx].r,path[gIdx].r-VIEW_ROWS+1));
  setPalette(lineK);
}
window.addEventListener('resize', layout);

const hud = document.getElementById('hud');
const progFill = document.getElementById('progFill');
function drawHud(){
  hud.setAttribute('aria-label',`体力${hp}`);
  hud.innerHTML=Array.from({length:MAX_HP},(_,i)=>`<svg viewBox="0 0 40 38" class="${i>=hp?'lost':''}" aria-hidden="true"><path d="M20 34C14 29 3 21 3 12C3 2 15 0 20 9C25 0 37 2 37 12C37 21 26 29 20 34Z" fill="${i>=hp?'#7485a8':'#bdff32'}" stroke="#081221" stroke-width="3.5" stroke-linejoin="round"/></svg>`).join('');
}
const PALETTES=[['#034afb','#00bff2','#11d6fb'],['#6500ed','#ed12eb','#c0ff3e'],['#006cd9','#00d5b0','#ffe941'],['#9820ed','#ff519b','#42f4ea'],['#0052f0','#06b7ff','#8eff50'],['#7316e7','#e92deb','#ffda35']];
function setPalette(k){
  const p=PALETTES[k%PALETTES.length],app=document.getElementById('app');
  app.style.setProperty('--sky1',p[0]);app.style.setProperty('--sky2',p[1]);app.dataset.zone=k%2;
}

// ===== ゲーム状態 =====
let state = 'loading';
let songStart = 0, hp, player, notes, effects, texts, nextBeat, acted, pendingCheck, charState, charUntil, shakeUntil, lastMoveAt, spawnSeed;
let noteId = 0;
let fx = [];
let lastBeatAt = -9, damageAt = -9;
let moveLocked = true; // 最初のブロックを壊すまで進めない

function reset(){
  lastBeatAt = -9; damageAt = -9;
  cameraRow=0;cameraFrom=0;cameraTarget=0;cameraAt=-9;setPalette(0);
  revealEnd=REVEAL_ENDS[0];revealFrom=revealEnd;
  document.getElementById('impactVeil').classList.remove('hit');
  cv.style.transform = '';
  hp = MAX_HP; player = { idx: 0, from: 0, at: 0 }; moveLocked = true;
  notes = []; effects = []; texts = []; fx = [];
  setLockUI(true);
  nextBeat = 0; acted = -1; pendingCheck = [];
  charState = 'idle'; charUntil = 0; shakeUntil = 0; spawnSeed = Math.floor(Math.random() * 100000) + 1; earlyInput = null;
  nextGap = 4; runLen = 1;
  lineK = 0; gIdx = gIndexFor(0); gMoveAt = -9; gFrom = gIdx;
  counts = { PERFECT: 0, GREAT: 0, GOOD: 0, MISS: 0 }; combo = 0; maxCombo = 0;
  drawHud();
}
let lineK = 0, gIdx = 0, gFrom = 0, gMoveAt = -9;

function fillGap(from, to, t){

// 4拍ごとのブロックの出し方

// 1＝くっついて連続で来る、2＝1マスあき、3＝2マスあき…
const GAPS_NORMAL = [1, 2, 2, 3, 3, 4];
const GAPS_DENSE  = [1, 1, 2, 2, 3];

let runLen = 1;

  let gp = GAPS[Math.floor(rand() * GAPS.length)];

  runLen = gp === 1 ? runLen + 1 : 1;

}

function onBeat(n, t){
  // ブロックが1マス迫る（最初の数拍は止まってる）
  if (n >= INTRO_BEATS && notes.length){
    for (const nt of notes){ nt.from = nt.idx; nt.idx -= 1; nt.at = t; }
    playMoveSE(n);
  }
  // ブロックを出す
  if (n >= INTRO_BEATS){
    const lastIdx = Math.max(-99, ...notes.map(x => x.idx));
    if (gIdx - lastIdx >= nextGap){
      notes.push({ id: noteId++, idx: gIdx, from: gIdx, at: t, pop: t });
      nextGap = pickGap();
    }
  }
  lastBeatAt = t;
  // 拍の直前に押されていたら今実行
  if (earlyInput && t - earlyInput.time <= WINDOW){ doAction(earlyInput.type, n, t, earlyInput.diff); }
  earlyInput = null;
  pendingCheck.push({ n, checkAt: beatTime(n) + WINDOW });
}

function checkHit(t){
  for (const nt of [...notes]){
    if (nt.idx <= player.idx){
      notes.splice(notes.indexOf(nt), 1);
      damage(t);
    }
  }
}

function damage(t){

  const veil = document.getElementById('impactVeil');
  veil.classList.remove('hit'); void veil.offsetWidth; veil.classList.add('hit');
  charState = 'damage'; charUntil = t + 0.4;

// ===== 判定 =====
const JUDGE = {
  PERFECT: { col: '#ffffff', glow: '#69dfe955' },
  GREAT:   { col: '#50e6ff', glow: '#0096ff' },
  GOOD:    { col: '#7dffb0', glow: '#00b464' },
  MISS:    { col: '#ff6178', glow: '#ff183c55' },
};
let counts = { PERFECT: 0, GREAT: 0, GOOD: 0, MISS: 0 }, combo = 0, maxCombo = 0;
function judgeOf(diff){
  const a = Math.abs(diff);

}
let jTimer = null;
function showJudge(word, sub){
  counts[word]++;

  const el = document.getElementById('judge'), w = document.getElementById('jWord');
  w.textContent = word; w.style.color = JUDGE[word].col; w.style.textShadow = '0 2px 0 #07101c';

function freeMove(t){
  if (moveLocked){ texts.push({ s: 'まず1個ブレイク', idx: player.idx, t, col: '#ffffff' }); return; }
  if (player.idx >= GOAL_INDEX) return;
  fx.push({ type: 'ghost', idx: player.idx, t, d: .13, flip: facesRight(player.idx) });
  player.from = player.idx; player.idx += 1; player.at = t;
  fx.push({ type: 'spark', idx: player.idx, t, d: .2 });
  charState = 'move'; charUntil = t + 0.18;

}
function flashBtn(id){ const b = document.getElementById(id); b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 160); }
function setLockUI(on){ const b = document.getElementById('bMove'); b.classList.toggle('locked', on); if (!on) flashBtn('bMove'); }

function doAction(type, n, t, diff){
  acted = n;
  const word = judgeOf(diff), sub = Math.abs(diff) <= 0.045 ? '' : (diff < 0 ? 'FAST' : 'LATE');
  if (type === 'move'){
    if (moveLocked){ texts.push({ s: 'まず1個ブレイク', idx: player.idx, t, col: '#ffffff' }); }
    else if (player.idx < GOAL_INDEX){
      fx.push({ type: 'ghost', idx: player.idx, t, d: .13, flip: facesRight(player.idx) });
      player.from = player.idx; player.idx += 1; player.at = t;
      fx.push({ type: 'spark', idx: player.idx, t, d: .2 });
      charState = 'move'; charUntil = t + 0.18;
      showJudge(word, sub);
    }
  } else {
    charState = 'slash'; charUntil = t + 0.22;
    // 1タップで壊せるのは一番近い1個だけ
    const target = notes.filter(x => x.idx <= player.idx).sort((a,b)=>a.idx-b.idx)[0];
    if (target){
      notes.splice(notes.indexOf(target), 1);
      effects.push({ idx: target.idx, t });
      fx.push({ type: 'cut', idx: player.idx, t, d: .16 });
      flashBtn('bBreak');
      if (moveLocked){ moveLocked = false; setLockUI(false); }
      playSE(word);
      showJudge(word, sub);
    }
  }
}

let earlyInput = null;
function input(type){
  if (state !== 'play') return;
  const t = songTime();
  if (type === 'move'){ freeMove(t); return; } // 進むは拍に関係なく、押した瞬間に動く
  const n = Math.round((t - OFFSET) / SPB);
  const diff = t - beatTime(n);
  if (Math.abs(diff) > WINDOW || n < 0){
    showJudge('MISS', 'タイミングずれ');
    return;
  }
  if (acted === n) return; // 1拍に1回だけ
  if (diff < 0){ earlyInput = { type, time: t, diff }; acted = n; }   // 拍の少し前 → 拍で実行
  else if (n < nextBeat){ doAction(type, n, t, diff); }               // 拍の少し後 → すぐ実行
  else { earlyInput = { type, time: t, diff }; acted = n; }
}

// 判定で音を変える：PERFECT＝キーン付きで派手、GREAT＝ふつう、GOOD＝こもった小さめ
// ブロックが動く音（毎拍なので小さめ。拍ぴったりの時刻に予約して鳴らす）
const MOVE_SE_VOL = 0.35;
function playMoveSE(n){
  if (!moveBuf || state !== 'play') return;
  const src = ctx.createBufferSource(), gn = ctx.createGain();
  src.buffer = moveBuf; gn.gain.value = MOVE_SE_VOL;
  src.connect(gn); gn.connect(ctx.destination);
  src.start(Math.max(ctx.currentTime, songStart + beatTime(n)));
}
function playSE(word){
  if (!breakBuf) return;
  const now = ctx.currentTime;
  const src = ctx.createBufferSource(); src.buffer = breakBuf;
  const gain = ctx.createGain(), filt = ctx.createBiquadFilter(); filt.type = 'lowpass';
  if (word === 'PERFECT'){ src.playbackRate.value = 1.08; filt.frequency.value = 20000; gain.gain.value = 1.0; }
  else if (word === 'GREAT'){ src.playbackRate.value = 1.0; filt.frequency.value = 12000; gain.gain.value = 0.85; }
  else { src.playbackRate.value = 0.9; filt.frequency.value = 1800; gain.gain.value = 0.6; }
  src.connect(filt); filt.connect(gain); gain.connect(ctx.destination); src.start(now);
  if (word === 'PERFECT'){
    // キラーンという高い音を重ねる
    for (const [f, v] of [[2093, .18], [3136, .12], [4186, .07]]){
      const o = ctx.createOscillator(), og = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      og.gain.setValueAtTime(0, now + .02); og.gain.linearRampToValueAtTime(v, now + .03);
      og.gain.exponentialRampToValueAtTime(.0001, now + .45);
      o.connect(og); og.connect(ctx.destination); o.start(now + .02); o.stop(now + .5);
    }

}

}

  if (state !== 'play') return;

  setTimeout(() => {
    if (songSrc){ try{ songSrc.stop(); }catch(e){} }
    const beats = Math.max(0, nextBeat);
    if (clear){ document.getElementById('clearTxt').innerHTML = `残りHP ${hp} ／ ${beats}拍でゴール<br>${resultLine()}`; document.getElementById('clearOv').classList.remove('hide'); }
    else { document.getElementById('overTxt').innerHTML = `ゴールまであと ${GOAL_INDEX - player.idx} マス<br>${resultLine()}`; document.getElementById('overOv').classList.remove('hide'); }
  }, clear ? 600 : 500);
}

// ===== 描画 =====
function cellXY(idx){

  const a = path[Math.floor(i)], b = path[Math.ceil(i)], f = i - Math.floor(i);
  return { x: PAD + (a.c + (b.c - a.c) * f + 0.5) * cell, y: PAD + (a.r + (b.r - a.r) * f - cameraRow + 0.5) * cell };

// ポーズごとの体の位置（画像から測った値）ax＝胴体の横位置、foot＝足の位置、bodyH＝体の高さの割合
const POSE = {
  idle:   { ax: 0.615, foot: 0.997, bodyH: 0.995 },
  move:   { ax: 0.586, foot: 0.999, bodyH: 0.999 },
  slash:  { ax: 0.645, foot: 0.995, bodyH: 0.923 },
  damage: { ax: 0.670, foot: 0.997, bodyH: 0.996 },
};
const CHAR_H = 0.98;   // 体の高さ（マス比）
const glowChar = { idle: true };
function drawPose(k, x, y){
  const im = IMG['char_' + k], P = POSE[k];
  if (!im || !im.naturalWidth) return;
  const h = cell * CHAR_H / P.bodyH, w = h * im.width / im.height;
  const footY = y + cell * .47;
  g.drawImage(im, x - w * P.ax, footY - h * P.foot, w, h);
}
function drawChar(t){
  if (t > charUntil) charState = 'idle';
  const p = cellXY(tween(player.from, player.idx, player.at, t));
  // 向き：段の進む方向だけ（下に降りるときも変えない）
  const faceRight = facesRight(player.idx);
  g.save(); g.translate(p.x, p.y);
  if (faceRight) g.scale(-1, 1);
  if (charState === 'damage' && Math.floor(t * 20) % 2) g.globalAlpha = .45;
  g.shadowColor='#061225';g.shadowBlur=2;drawPose(charState, 0, 0);
  g.restore();
}

// ===== ループ =====
function loop(){
  requestAnimationFrame(loop);
  if (state === 'loading') return;
  const t = state === 'play' || state === 'clear' || state === 'over' ? songTime() : 0;
  if (state === 'play'){
    syncClock();
    while (t >= beatTime(nextBeat)){ onBeat(nextBeat, beatTime(nextBeat)); nextBeat++; }
    while (pendingCheck.length && t >= pendingCheck[0].checkAt){ pendingCheck.shift(); checkHit(t); }
    if (player.idx >= LINES[lineK] && hp > 0){
      if (lineK === LINES.length - 1){ fx.push({ type: 'goal', idx: player.idx, t, d: .5 }); end(true); }
      else {
        lineK++; gFrom = gIdx; gIdx = gIndexFor(lineK); gMoveAt = t;
        advanceView(t);
        fillGap(gFrom + 1, gIdx, t);
        texts.push({ s: '突破！', idx: player.idx, t, col: '#50e6ff' });
      }
    }
    if (t > songBuf.duration) end(false);
  }
  if (state === 'play' && songBuf) progFill.style.width = (Math.min(1, Math.max(0, t / songBuf.duration)) * 100) + '%';
  draw(t);
}

// ===== 操作 =====
function bindBtn(id, type){
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('press'); input(type); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => el.addEventListener(ev, () => el.classList.remove('press')));
}
bindBtn('bBreak', 'break'); bindBtn('bMove', 'move');
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key === 'ArrowRight' || e.key === 'k') input('break');
  if (e.key === 'ArrowLeft' || e.key === ' ' || e.key === 'j') input('move');
});

function startGame(){
  document.querySelectorAll('.overlay').forEach(o => o.classList.add('hide'));
  reset(); progFill.style.width = '0%';
  if (songSrc){ try{ songSrc.stop(); }catch(e){} }
  songSrc = ctx.createBufferSource(); songSrc.buffer = songBuf; songSrc.connect(ctx.destination);
  songStart = ctx.currentTime + 0.25;
  clockOffset = ctx.currentTime - performance.now() / 1000;
  songSrc.start(songStart);
  state = 'play';
}
document.querySelectorAll('[data-retry]').forEach(b => b.addEventListener('click', startGame));
document.querySelectorAll('[data-select]').forEach(b => b.addEventListener('click', () => {
  state = 'ready';
  document.querySelectorAll('.overlay').forEach(o => o.classList.add('hide'));
  document.getElementById('startOv').classList.remove('hide');
}));

let pickingSong = false;
async function pickSong(sg, btn){
  if (pickingSong) return;
  pickingSong = true;
  const buttons = [...document.querySelectorAll('.songBtn')];
  buttons.forEach(b => b.disabled = true);
  const label = btn.querySelector('small'), orig = label.textContent;
  try {
    if (ctx.state === 'suspended') await ctx.resume();
    if (!bufCache[sg.file]){
      label.textContent = '読み込み中…';
      bufCache[sg.file] = await ctx.decodeAudioData(await loadAudio(sg.file));
    }
    setSong(sg); songBuf = bufCache[sg.file];
    startGame();
  } catch(e) {
    document.getElementById('loadTxt').textContent = '曲を読み込めませんでした。もう一度選んでください。';
  } finally {
    label.textContent = orig; buttons.forEach(b => b.disabled = false); pickingSong = false;
  }
}

// ===== 起動 =====
(async () => {
  layout();
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  setSong(SONGS[0]);
  const [seAB] = await Promise.all([loadAudio('audio/break.mp3').catch(() => null), ...imgList.map(loadImg)]);
  if (seAB) try { breakBuf = await ctx.decodeAudioData(seAB); } catch(e) {}
  loadAudio('audio/block_move.mp3').then(ab => ctx.decodeAudioData(ab)).then(b => moveBuf = b).catch(() => {});
  reset(); layout();
  state = 'ready';
  document.getElementById('loadTxt').textContent = '曲をえらんでスタート';
  const list = document.getElementById('songList');
  for (const sg of SONGS){
    const b = document.createElement('button'); b.className = 'songBtn' + (sg.hard ? ' hard' : '');
    b.innerHTML = `<span>${sg.name}</span><small>${sg.level}</small>`;
    b.addEventListener('click', () => pickSong(sg, b)); list.appendChild(b);
  }
  loop();
})();
</script>
