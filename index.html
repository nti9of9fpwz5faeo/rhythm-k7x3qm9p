<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07060d">
<title>Neon Blade</title>
<style>
  :root{--cyan:#50e6ff;--pink:#ed50aa;--gold:#ffc83c;--bg:#07060d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;color:#e8f6ff}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;background:url(img/bg.jpg) center/cover no-repeat}
  #hud{height:56px;display:flex;align-items:center;gap:6px;padding-top:env(safe-area-inset-top)}
  #hud img{width:34px;height:34px;transition:opacity .2s,transform .2s}
  #hud img.lost{opacity:.18;transform:scale(.8)}
  #judge{height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  #jWord{font-size:30px;font-weight:900;letter-spacing:.04em;font-style:italic}
  #jSub{font-size:12px;margin-top:3px;opacity:.85}
  #judge.pop #jWord{animation:jpop .35s ease-out}
  @keyframes jpop{0%{transform:scale(1.5);opacity:.4}40%{transform:scale(.95);opacity:1}100%{transform:scale(1)}}
  #fieldWrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
  canvas{display:block}
  #controls{height:170px;width:100%;max-width:520px;display:flex;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
  .btn{width:140px;height:140px;border:0;background:none;padding:0;touch-action:none}
  .btn img{width:100%;height:100%;pointer-events:none;transition:transform .06s}
  .btn.press img{transform:scale(.9)}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:18vh;background:center/cover no-repeat;z-index:10}
  .overlay.hide{display:none}
  #startOv{background-image:url(img/bg.jpg);justify-content:center;padding:0}
  #startOv h1{font-size:44px;margin:0 0 8px;color:#fff;text-shadow:0 0 12px var(--cyan),0 0 28px var(--cyan)}
  #startOv p{margin:6px 0;color:#bfe9f5}
  #songList{display:flex;flex-direction:column;gap:14px;margin-top:22px;width:min(320px,86vw)}
  .songBtn{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-radius:14px;border:2px solid var(--cyan);background:rgba(7,6,13,.75);color:#fff;font-size:18px;box-shadow:0 0 14px rgba(80,230,255,.35)}
  .songBtn small{color:#9fd8e6;font-size:13px}
  .songBtn.hard{border-color:var(--pink);box-shadow:0 0 14px rgba(237,80,170,.4)}
  .ovBtn.sub{font-size:16px;padding:10px 26px;margin-top:12px;border-color:#556}
  .ovBtn{margin-top:22px;font-size:22px;padding:14px 38px;border-radius:40px;border:2px solid var(--cyan);background:rgba(7,6,13,.7);color:#fff;box-shadow:0 0 16px rgba(80,230,255,.5)}
  #clearOv{background-image:url(img/clear.jpg)}
  #overOv{background-image:url(img/gameover.jpg)}
  #overOv .ovBtn{border-color:var(--pink);box-shadow:0 0 16px rgba(237,80,170,.5)}
  .result{font-size:17px;line-height:1.7;text-align:center;color:#fff;text-shadow:0 0 8px #000}
</style>
</head>
<body>
<div id="app">
  <div id="hud"></div>
  <div id="judge"><span id="jWord"></span><small id="jSub"></small></div>
  <div id="fieldWrap"><canvas id="cv"></canvas></div>
  <div id="controls">
    <button class="btn" id="bMove" aria-label="進む"><img src="img/btn_move.png" alt=""></button>
    <button class="btn" id="bBreak" aria-label="ブレイク"><img src="img/btn_break.png" alt=""></button>
  </div>
</div>

<div class="overlay" id="startOv">
  <h1>Neon Blade</h1>
  <p id="loadTxt">読み込み中…</p>
  <div id="songList"></div>
</div>
<div class="overlay hide" id="clearOv"><div class="result" id="clearTxt"></div><button class="ovBtn" data-retry>もう一回</button><button class="ovBtn sub" data-select>曲えらび</button></div>
<div class="overlay hide" id="overOv"><div class="result" id="overTxt"></div><button class="ovBtn" data-retry>もう一回</button><button class="ovBtn sub" data-select>曲えらび</button></div>

<script>
// ===== 設定 =====
// 曲リスト（bpm＝テンポ、offset＝最初のドンまでの秒数）
const SONGS = [
  { name: 'Zombie Protocol',     file: 'audio/song.mp3',    bpm: 129,   offset: 0.34, level: 'ふつう' },
  { name: 'Stutter Bass Groove', file: 'audio/stutter.mp3', bpm: 150.1, offset: 0.0,  level: 'はやい', hard: true },
];
let song = SONGS[0], BPM, OFFSET, SPB, WINDOW;
function setSong(sg){ song = sg; BPM = sg.bpm; OFFSET = sg.offset; SPB = 60 / BPM; WINDOW = Math.min(0.17, SPB * 0.36); }
const COLS = 8, ROWS = 7;
const MAX_HP = 5;
// チェックポイント（破線）。着いたら解除されて、Gが次の場所へ移動
const LINES = [4, 12, 20, 28, 36, 44, 51];
const G_AHEAD = 4;        // Gはラインの何マス先に置くか
const GOAL_INDEX = LINES[LINES.length - 1]; // 最後のラインでクリア
const INTRO_BEATS = 4;    // 最初の数拍はブロックが止まってる（準備時間）
const FIRST_GAP = 3;      // スタートから一番近いブロックまでのマス数

// ===== コース（ジグザグ） =====
const path = [];
for (let r = 0; r < ROWS; r++) {
  if (r % 2 === 0) for (let c = COLS - 1; c >= 0; c--) path.push({ c, r });
  else for (let c = 0; c < COLS; c++) path.push({ c, r });
}
const EXIT_INDEX = path.length - 1;

// ===== 画像 =====
const IMG = {};
const imgList = ['floor.jpg','wall.png','start.png','exit.png','block.png','block_broken.png',
  'char_idle.png','char_move.png','char_slash.png','char_damage.png','heart.png'];
function loadImg(n){return new Promise(res=>{const i=new Image();i.onload=()=>res();i.onerror=()=>res();i.src='img/'+n;IMG[n.split('.')[0]]=i;});}

// ===== 音 =====
let ctx, songBuf, breakBuf, songSrc = null;
const bufCache = {};
async function loadAudio(url){const r=await fetch(url);return await r.arrayBuffer();}

// ===== 画面 =====
const cv = document.getElementById('cv'); let g = cv.getContext('2d');
let cell = 40, dpr = 1;
function layout(){
  const wrap = document.getElementById('fieldWrap').getBoundingClientRect();
  cell = Math.floor(Math.min((wrap.width - 16) / COLS, (wrap.height - 8) / ROWS));
  dpr = window.devicePixelRatio || 1;
  cv.style.width = cell * COLS + 'px'; cv.style.height = cell * ROWS + 'px';
  cv.width = cell * COLS * dpr; cv.height = cell * ROWS * dpr;
  if (IMG.floor && IMG.floor.complete) buildStatic();
}
window.addEventListener('resize', layout);

const hud = document.getElementById('hud');
function drawHud(){
  hud.innerHTML='';
  for(let i=0;i<MAX_HP;i++){const im=document.createElement('img');im.src='img/heart.png';if(i>=hp)im.className='lost';hud.appendChild(im);}
}

// ===== ゲーム状態 =====
let state = 'loading';
let songStart = 0, hp, player, notes, effects, texts, nextBeat, acted, pendingCheck, charState, charUntil, shakeUntil, lastMoveAt, spawnSeed;
let noteId = 0;
let moveLocked = true; // 最初のブロックを壊すまで進めない

function reset(){
  hp = MAX_HP; player = { idx: 0, from: 0, at: 0 }; moveLocked = true;
  notes = []; effects = []; texts = [];
  nextBeat = 0; acted = -1; pendingCheck = [];
  charState = 'idle'; charUntil = 0; shakeUntil = 0; spawnSeed = Math.floor(Math.random() * 100000) + 1; earlyInput = null;
  lineK = 0; gIdx = gIndexFor(0); gMoveAt = -9; gFrom = gIdx;
  counts = { PERFECT: 0, GREAT: 0, GOOD: 0, MISS: 0 }; combo = 0; maxCombo = 0;
  drawHud();
}
// スタート時点で、もう道にブロックが流れてる状態にする
let lineK = 0, gIdx = 0, gFrom = 0, gMoveAt = -9;
function gIndexFor(k){ return Math.min(LINES[k] + G_AHEAD, EXIT_INDEX); }
function prefillNotes(){
  let pat = PATTERNS[0], last = -9;
  for (let i = FIRST_GAP; i <= EXIT_INDEX; i++){
    const k = i - FIRST_GAP;
    if (k % 4 === 0) pat = PATTERNS[Math.floor(rand() * PATTERNS.length)];
    if ((pat[k % 4] || i === FIRST_GAP) && i - last > 1){ notes.push({ id: noteId++, idx: i, from: i, at: -9, pop: 0 }); last = i; }
  }
}
function rand(){ spawnSeed = (spawnSeed * 16807) % 2147483647; return spawnSeed / 2147483647; }

let clockOffset = 0; // performance.now と音の時計のズレ
function syncClock(){
  const est = ctx.currentTime - performance.now() / 1000;
  clockOffset = clockOffset === null ? est : clockOffset + (est - clockOffset) * 0.05;
}
function songTime(){
  return performance.now() / 1000 + clockOffset - songStart - (ctx.outputLatency || 0) - (ctx.baseLatency || 0);
}
function beatTime(n){ return OFFSET + n * SPB; }

// 4拍ごとのブロックの出し方
const PATTERNS = [[1,0,1,0],[1,0,0,0],[1,0,1,0],[0,0,1,0],[1,0,0,1]];
let curPattern = PATTERNS[0];

function onBeat(n, t){
  // ブロックが1マス迫る（最初の数拍は止まってる）
  if (n >= INTRO_BEATS) for (const nt of notes){ nt.from = nt.idx; nt.idx -= 1; nt.at = t; }
  // ブロックを出す
  if (n >= INTRO_BEATS){
    if (n % 4 === 0) curPattern = PATTERNS[Math.floor(rand() * PATTERNS.length)];
    if (curPattern[n % 4] && !notes.some(x => x.idx >= gIdx - 1)){
      notes.push({ id: noteId++, idx: gIdx, from: gIdx, at: t, pop: t });
    }
  }
  shakeUntil = t + 0.08;
  // 拍の直前に押されていたら今実行
  if (earlyInput && t - earlyInput.time <= WINDOW){ doAction(earlyInput.type, n, t, earlyInput.diff); }
  earlyInput = null;
  pendingCheck.push({ n, checkAt: beatTime(n) + WINDOW });
}

function checkHit(t){
  for (const nt of [...notes]){
    if (nt.idx <= player.idx){
      notes.splice(notes.indexOf(nt), 1);
      damage(t);
    }
  }
}

function damage(t){
  hp--; drawHud();
  charState = 'damage'; charUntil = t + 0.4;
  texts.push({ s: 'ダメージ', idx: player.idx, t, col: '#ed50aa' });
  showJudge('MISS', '被弾');
  if (navigator.vibrate) navigator.vibrate(60);
  if (hp <= 0) end(false);
}

// ===== 判定 =====
const JUDGE = {
  PERFECT: { col: '#ffe36e', glow: '#ffb400' },
  GREAT:   { col: '#50e6ff', glow: '#0096ff' },
  GOOD:    { col: '#7dffb0', glow: '#00b464' },
  MISS:    { col: '#ed50aa', glow: '#a0006a' },
};
let counts = { PERFECT: 0, GREAT: 0, GOOD: 0, MISS: 0 }, combo = 0, maxCombo = 0;
function judgeOf(diff){
  const a = Math.abs(diff);
  if (a <= 0.045) return 'PERFECT';
  if (a <= 0.09) return 'GREAT';
  return 'GOOD';
}
let jTimer = null;
function showJudge(word, sub){
  counts[word]++;
  if (word === 'MISS') combo = 0; else { combo++; maxCombo = Math.max(maxCombo, combo); }
  const el = document.getElementById('judge'), w = document.getElementById('jWord');
  w.textContent = word; w.style.color = JUDGE[word].col; w.style.textShadow = `0 0 12px ${JUDGE[word].glow}`;
  document.getElementById('jSub').textContent = (combo >= 2 ? combo + ' COMBO  ' : '') + (sub || '');
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  clearTimeout(jTimer); jTimer = setTimeout(() => { w.textContent = ''; document.getElementById('jSub').textContent = ''; }, 700);
}

function doAction(type, n, t, diff){
  acted = n;
  const word = judgeOf(diff), sub = Math.abs(diff) <= 0.045 ? '' : (diff < 0 ? 'FAST' : 'LATE');
  if (type === 'move'){
    if (moveLocked){ texts.push({ s: 'まず1個ブレイク', idx: player.idx, t, col: '#50e6ff' }); }
    else if (player.idx < GOAL_INDEX){
      player.from = player.idx; player.idx += 1; player.at = t;
      charState = 'move'; charUntil = t + 0.18;
      showJudge(word, sub);
    }
  } else {
    charState = 'slash'; charUntil = t + 0.22;
    // 1タップで壊せるのは一番近い1個だけ
    const target = notes.filter(x => x.idx <= player.idx).sort((a,b)=>a.idx-b.idx)[0];
    if (target){
      notes.splice(notes.indexOf(target), 1);
      effects.push({ idx: target.idx, t });
      moveLocked = false;
      playSE(word);
      showJudge(word, sub);
    }
  }
}

let earlyInput = null;
function input(type){
  if (state !== 'play') return;
  const t = songTime();
  const n = Math.round((t - OFFSET) / SPB);
  const diff = t - beatTime(n);
  if (Math.abs(diff) > WINDOW || n < 0){
    showJudge('MISS', 'タイミングずれ');
    return;
  }
  if (acted === n) return; // 1拍に1回だけ
  if (diff < 0){ earlyInput = { type, time: t, diff }; acted = n; }   // 拍の少し前 → 拍で実行
  else if (n < nextBeat){ doAction(type, n, t, diff); }               // 拍の少し後 → すぐ実行
  else { earlyInput = { type, time: t, diff }; acted = n; }
}

// 判定で音を変える：PERFECT＝キーン付きで派手、GREAT＝ふつう、GOOD＝こもった小さめ
function playSE(word){
  if (!breakBuf) return;
  const now = ctx.currentTime;
  const src = ctx.createBufferSource(); src.buffer = breakBuf;
  const gain = ctx.createGain(), filt = ctx.createBiquadFilter(); filt.type = 'lowpass';
  if (word === 'PERFECT'){ src.playbackRate.value = 1.08; filt.frequency.value = 20000; gain.gain.value = 1.0; }
  else if (word === 'GREAT'){ src.playbackRate.value = 1.0; filt.frequency.value = 12000; gain.gain.value = 0.85; }
  else { src.playbackRate.value = 0.9; filt.frequency.value = 1800; gain.gain.value = 0.6; }
  src.connect(filt); filt.connect(gain); gain.connect(ctx.destination); src.start(now);
  if (word === 'PERFECT'){
    // キラーンという高い音を重ねる
    for (const [f, v] of [[2093, .18], [3136, .12], [4186, .07]]){
      const o = ctx.createOscillator(), og = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      og.gain.setValueAtTime(0, now + .02); og.gain.linearRampToValueAtTime(v, now + .03);
      og.gain.exponentialRampToValueAtTime(.0001, now + .45);
      o.connect(og); og.connect(ctx.destination); o.start(now + .02); o.stop(now + .5);
    }
  }
}

function resultLine(){
  return `PERFECT ${counts.PERFECT}　GREAT ${counts.GREAT}　GOOD ${counts.GOOD}　MISS ${counts.MISS}<br>最大コンボ ${maxCombo}`;
}
function end(clear){
  if (state !== 'play') return;
  state = clear ? 'clear' : 'over';
  setTimeout(() => {
    if (songSrc){ try{ songSrc.stop(); }catch(e){} }
    const beats = Math.max(0, nextBeat);
    if (clear){ document.getElementById('clearTxt').innerHTML = `残りHP ${hp} ／ ${beats}拍でゴール<br>${resultLine()}`; document.getElementById('clearOv').classList.remove('hide'); }
    else { document.getElementById('overTxt').innerHTML = `ゴールまであと ${GOAL_INDEX - player.idx} マス<br>${resultLine()}`; document.getElementById('overOv').classList.remove('hide'); }
  }, clear ? 600 : 500);
}

// ===== 描画 =====
function cellXY(idx){
  const i = Math.max(0, Math.min(path.length - 1, idx));
  const a = path[Math.floor(i)], b = path[Math.ceil(i)], f = i - Math.floor(i);
  return { x: (a.c + (b.c - a.c) * f + 0.5) * cell, y: (a.r + (b.r - a.r) * f + 0.5) * cell };
}
function tween(from, to, at, t){
  const k = Math.min(1, Math.max(0, (t - at) / 0.09)); // 0.09秒でサッと動いて止まる
  const e = 1 - Math.pow(1 - k, 3);
  return from + (to - from) * e;
}

// 動かない部分（床・壁・S・G・ゴール）は1回だけ描いておく
const staticCv = document.createElement('canvas');
const glowChar = {};
function buildStatic(){
  staticCv.width = cell * COLS * dpr; staticCv.height = cell * ROWS * dpr;
  const g0 = g; g = staticCv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  // 床
  g.fillStyle = 'rgba(5,5,12,.55)'; g.fillRect(0, 0, cell * COLS, cell * ROWS);
  for (const p of path){ g.globalAlpha = .9; g.drawImage(IMG.floor, p.c * cell, p.r * cell, cell, cell); }
  g.globalAlpha = 1;
  // 方眼
  g.strokeStyle = 'rgba(80,230,255,.14)'; g.lineWidth = 1;
  for (let c = 1; c < COLS; c++){ g.beginPath(); g.moveTo(c * cell, 0); g.lineTo(c * cell, ROWS * cell); g.stroke(); }
  for (let r = 1; r < ROWS; r++){ g.beginPath(); g.moveTo(0, r * cell); g.lineTo(COLS * cell, r * cell); g.stroke(); }

  // スタートと出口
  const s0 = cellXY(0);
  g.drawImage(IMG.start, s0.x - cell * .46, s0.y - cell * .46, cell * .92, cell * .92);

  // 壁
  const wh = Math.max(6, cell * .16);
  for (let r = 0; r < ROWS - 1; r++){
    const y = (r + 1) * cell - wh / 2;
    const x0 = r % 2 === 0 ? cell : 0, x1 = r % 2 === 0 ? COLS * cell : (COLS - 1) * cell;
    g.drawImage(IMG.wall, x0, y, x1 - x0, wh);
  }
  g.strokeStyle = '#1d2230'; g.lineWidth = 3; g.strokeRect(1.5, 1.5, COLS * cell - 3, ROWS * cell - 3);

  g = g0;
  // キャラの光るふちどりも先に作っておく
  for (const k of ['idle','move','slash','damage']){
    const im = IMG['char_' + k]; const w = Math.round(cell * 2.3 * dpr), h = Math.round(w * im.height / im.width), pad = Math.round(cell * .3 * dpr);
    const c = document.createElement('canvas'); c.width = w + pad * 2; c.height = h + pad * 2;
    const x = c.getContext('2d'); x.shadowColor = 'rgba(80,230,255,.9)'; x.shadowBlur = cell * .25 * dpr;
    x.drawImage(im, pad, pad, w, h); glowChar[k] = { c, pad: pad / dpr, w: w / dpr, h: h / dpr };
  }
}

function draw(t){
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  let sx = 0, sy = 0;
  if (t < shakeUntil){ sx = (Math.random() - .5) * 5; sy = (Math.random() - .5) * 5; }
  g.clearRect(0, 0, cell * COLS, cell * ROWS);
  g.save(); g.translate(sx, sy);

  g.drawImage(staticCv, 0, 0, cell * COLS, cell * ROWS);
  drawLineAndG(t);

  // ブロック
  for (const nt of notes){
    const p = cellXY(tween(nt.from, nt.idx, nt.at, t));
    const sz = cell * .94 * (nt.pop ? Math.min(1, Math.max(0, (t - nt.pop) / 0.2)) : 1);
    g.drawImage(IMG.block, p.x - sz / 2, p.y - sz / 2, sz, sz);
  }
  // 壊れたブロック
  effects = effects.filter(e => t - e.t < 0.3);
  for (const e of effects){
    const k = (t - e.t) / 0.3, p = cellXY(e.idx), sz = cell * (1.1 + k * .3);
    g.globalAlpha = 1 - k; g.drawImage(IMG.block_broken, p.x - sz / 2, p.y - sz / 2, sz, sz); g.globalAlpha = 1;
  }

  // キャラ
  drawChar(t);

  // 文字
  texts = texts.filter(x => t - x.t < 0.5);
  g.textAlign = 'center'; g.font = `bold ${Math.round(cell * .32)}px sans-serif`;
  for (const x of texts){
    const p = cellXY(x.idx), k = (t - x.t) / 0.5;
    g.globalAlpha = 1 - k; g.fillStyle = x.col; g.fillText(x.s, p.x, p.y - cell * .55 - k * cell * .3); g.globalAlpha = 1;
  }
  g.restore();
}

// マスiとi+1の境目に線を引く
function edgeLine(i){
  const a = path[i], b = path[i + 1];
  if (!b) return null;
  if (a.r === b.r){ const x = Math.max(a.c, b.c) * cell; return [x, a.r * cell + 4, x, (a.r + 1) * cell - 4]; }
  const y = Math.max(a.r, b.r) * cell; return [a.c * cell + 4, y, (a.c + 1) * cell - 4, y];
}
function drawLineAndG(t){
  const last = lineK === LINES.length - 1;
  const L = edgeLine(LINES[lineK]);
  if (L){
    g.save(); g.strokeStyle = last ? '#ffc83c' : '#50e6ff'; g.lineWidth = 3; g.setLineDash([6, 5]);
    g.globalAlpha = .6 + .4 * Math.max(0, 1 - ((t - OFFSET) / SPB % 1) * 2); // 拍でドクッと光る
    g.beginPath(); g.moveTo(L[0], L[1]); g.lineTo(L[2], L[3]); g.stroke(); g.restore();
  }
  // G（移動するときはシュッと動く）
  const k = Math.min(1, Math.max(0, (t - gMoveAt) / 0.35)), e = 1 - Math.pow(1 - k, 3);
  const p = cellXY(gFrom + (gIdx - gFrom) * e), sz = cell * .96;
  g.drawImage(IMG.exit, p.x - sz / 2, p.y - sz / 2, sz, sz);
}

function drawChar(t){
  if (t > charUntil) charState = 'idle';
  const sp = glowChar[charState];
  const p = cellXY(tween(player.from, player.idx, player.at, t));
  // 向き：段の進む方向だけ（下に降りるときも変えない）
  const faceRight = path[player.idx].r % 2 === 1;
  const ax = 0.66, ay = 0.52; // 画像の中で体の中心がある場所
  g.save(); g.translate(p.x, p.y);
  if (faceRight) g.scale(-1, 1);
  if (charState === 'damage' && Math.floor(t * 20) % 2) g.globalAlpha = .45;
  g.drawImage(sp.c, -sp.w * ax - sp.pad, -sp.h * ay - sp.pad, sp.w + sp.pad * 2, sp.h + sp.pad * 2);
  g.restore();
}

// ===== ループ =====
function loop(){
  requestAnimationFrame(loop);
  if (state === 'loading') return;
  const t = state === 'play' || state === 'clear' || state === 'over' ? songTime() : 0;
  if (state === 'play'){
    syncClock();
    while (t >= beatTime(nextBeat)){ onBeat(nextBeat, beatTime(nextBeat)); nextBeat++; }
    while (pendingCheck.length && t >= pendingCheck[0].checkAt){ pendingCheck.shift(); checkHit(t); }
    if (player.idx >= LINES[lineK] && hp > 0){
      if (lineK === LINES.length - 1) end(true);
      else {
        lineK++; gFrom = gIdx; gIdx = gIndexFor(lineK); gMoveAt = t;
        texts.push({ s: '突破！', idx: player.idx, t, col: '#50e6ff' });
      }
    }
    if (t > songBuf.duration) end(false);
  }
  draw(t);
}

// ===== 操作 =====
function bindBtn(id, type){
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('press'); input(type); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => el.addEventListener(ev, () => el.classList.remove('press')));
}
bindBtn('bBreak', 'break'); bindBtn('bMove', 'move');
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key === 'ArrowRight' || e.key === 'k') input('break');
  if (e.key === 'ArrowLeft' || e.key === ' ' || e.key === 'j') input('move');
});

function startGame(){
  document.querySelectorAll('.overlay').forEach(o => o.classList.add('hide'));
  reset();
  if (songSrc){ try{ songSrc.stop(); }catch(e){} }
  songSrc = ctx.createBufferSource(); songSrc.buffer = songBuf; songSrc.connect(ctx.destination);
  songStart = ctx.currentTime + 0.25;
  clockOffset = ctx.currentTime - performance.now() / 1000;
  songSrc.start(songStart);
  state = 'play';
}
document.querySelectorAll('[data-retry]').forEach(b => b.addEventListener('click', startGame));
document.querySelectorAll('[data-select]').forEach(b => b.addEventListener('click', () => {
  state = 'ready';
  document.querySelectorAll('.overlay').forEach(o => o.classList.add('hide'));
  document.getElementById('startOv').classList.remove('hide');
}));

async function pickSong(sg, btn){
  if (ctx.state === 'suspended') await ctx.resume();
  const label = btn.querySelector('small'), orig = label.textContent;
  if (!bufCache[sg.file]){
    label.textContent = '読み込み中…';
    bufCache[sg.file] = await ctx.decodeAudioData(await loadAudio(sg.file));
    label.textContent = orig;
  }
  setSong(sg); songBuf = bufCache[sg.file];
  startGame();
}

// ===== 起動 =====
(async () => {
  layout();
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  setSong(SONGS[0]);
  const [seAB] = await Promise.all([loadAudio('audio/break.mp3'), ...imgList.map(loadImg)]);
  breakBuf = await ctx.decodeAudioData(seAB);
  reset(); layout();
  state = 'ready';
  document.getElementById('loadTxt').textContent = '曲をえらんでスタート';
  const list = document.getElementById('songList');
  for (const sg of SONGS){
    const b = document.createElement('button'); b.className = 'songBtn' + (sg.hard ? ' hard' : '');
    b.innerHTML = `<span>${sg.name}</span><small>${sg.level}</small>`;
    b.addEventListener('click', () => pickSong(sg, b)); list.appendChild(b);
  }
  loop();
})();
</script>
